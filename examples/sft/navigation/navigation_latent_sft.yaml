defaults:
  - /trainer/config/sft_trainer
  - _self_

data:
  train_files: null
  val_files: null
  prompt_key: prompt
  response_key: response
  max_length: 2048
  micro_batch_size_per_gpu: 1
  latent_sft:
    enable: true
    action_start_token: "<|action_start|>"
    clip_coef: 1.0
    mae_coef: 1.0
    clip_feature_dim: 512
    mae_feature_dim: 768
    head_hidden_dim: null
    head_lr: 1e-4
    clip_model_name: openai/clip-vit-base-patch32
    mae_model_name: facebook/vit-mae-base
    hybrid_fill:
      enable: true

model:
  partial_pretrain: Qwen/Qwen2.5-0.5B-Instruct
  lora_rank: 32
  lora_alpha: 16
  target_modules: all-linear

trainer:
  project_name: navigation-latent-sft
  experiment_name: qwen-0.5b
  logger: ["console"]
